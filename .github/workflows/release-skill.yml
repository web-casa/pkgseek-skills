name: release-skill

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package pkgseek-linux.skill
        run: |
          cd skills
          zip -r ../pkgseek-linux.skill pkgseek-linux \
            -x '*/__pycache__/*' '*/.DS_Store' '*.pyc' '*/node_modules/*'
          cd ..
          cp pkgseek-linux.skill pkgseek-linux.zip
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" --generate-notes \
            pkgseek-linux.skill pkgseek-linux.zip \
          || gh release upload "${{ github.ref_name }}" \
            pkgseek-linux.skill pkgseek-linux.zip --clobber
